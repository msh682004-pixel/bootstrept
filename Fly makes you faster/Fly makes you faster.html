<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly makes you faster</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header>
        <div class="container">
            <div class="navbar-content">
                <a href="#" class="brand">Landing</a>
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Features</a></li>
                    <li><a href="#">Reviews</a></li>
                    <li><a href="#">Pricing</a></li>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#" class="btn-started">Get Started</a></li>
                </ul>
            </div>
        </div>
    </header>

    
    <div class="main-content">
        <div class="container">
            <div class="row">
                
               
                <div class="col-left">
                    <h1 class="hero-title">Fly makes you<br>faster</h1>
                    <p class="hero-text">
                        New free template by <a href="#">uicookies.com</a>. For more templates visit the site. Lorem ipsum dolor sit amet, consectetur adipisicing elit.
                    </p>
                    <button class="btn-pricing">See Pricing</button>
                </div>

             
                <div class="col-right">
                    <div class="signup-card">
                        <h2>Sign Up for Free</h2>
                        <form onsubmit="event.preventDefault();">
                            <div class="form-group">
                                <input type="text" class="form-input" placeholder="Full name">
                            </div>
                            <div class="form-group">
                                <input type="email" class="form-input" placeholder="Email">
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-input" placeholder="Password">
                            </div>
                            <div class="form-group">
                                <select class="form-input">
                                    <option selected disabled>Type</option>
                                    <option>Option 1</option>
                                    <option>Option 2</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-register">Register</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
